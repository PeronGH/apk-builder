name: Repair failed bump build

on:
  repository_dispatch:
    types: [repair-bump-build]

concurrency:
  group: repair-build
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      FAILED_RUN_ID: ${{ github.event.client_payload.run_id }}
      FAILED_RUN_URL: ${{ github.event.client_payload.run_url }}
      FAILED_BEFORE_SHA: ${{ github.event.client_payload.before }}
      FAILED_AFTER_SHA: ${{ github.event.client_payload.after }}
      PI_SKIP_VERSION_CHECK: '1'
      PI_TELEMETRY: '0'
    steps:
      - name: Checkout failed post-bump SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.client_payload.after }}
          fetch-depth: 0
          submodules: recursive

      - name: Verify checkout is on main's history
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor "$FAILED_AFTER_SHA" origin/main; then
            echo "error: $FAILED_AFTER_SHA is not an ancestor of origin/main; refusing to repair unrelated history" >&2
            exit 1
          fi
          echo "MAIN_BEFORE=$(git rev-parse origin/main)" >>"$GITHUB_ENV"

      - name: Create repair branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "fix/ci-$FAILED_RUN_ID"
          echo "REPAIR_BRANCH=fix/ci-$FAILED_RUN_ID" >>"$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - uses: android-actions/setup-android@v4

      - name: Install Pi
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.pi/agent"
          install -m 600 .github/pi/models.json "$HOME/.pi/agent/models.json"
          npm install -g --ignore-scripts @earendil-works/pi-coding-agent@0.84.2

      - name: Run repair agent
        run: |
          set -euo pipefail
          pi \
            --print \
            --no-session \
            --no-extensions \
            --no-skills \
            --no-prompt-templates \
            --thinking high \
            @.github/pi/fix-failed-build.md

      - name: Verify repair outcome
        if: always()
        run: |
          set -euo pipefail
          git fetch origin main
          main_after="$(git rev-parse origin/main)"
          if [ "$main_after" != "$MAIN_BEFORE" ]; then
            echo "error: origin/main moved from $MAIN_BEFORE to $main_after during the repair job" >&2
            exit 1
          fi
          if ! git diff --quiet "$FAILED_AFTER_SHA" HEAD -- .github/workflows .github/pi; then
            echo "error: repair modified .github/workflows/** or .github/pi/**; these need human review" >&2
            exit 1
          fi
          if [ -n "${REPAIR_BRANCH:-}" ] && git ls-remote --exit-code --heads origin "refs/heads/$REPAIR_BRANCH" >/dev/null 2>&1; then
            prs="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$REPAIR_BRANCH" --state open --json url)"
            if [ "$(printf '%s' "$prs" | jq length)" -gt 0 ]; then
              printf '%s' "$prs" | jq -r '.[].url'
              exit 0
            fi
            echo "error: repair branch $REPAIR_BRANCH was pushed but no open PR targets main" >&2
            exit 1
          fi
          if [ -f "$RUNNER_TEMP/repair-no-fix.txt" ]; then
            echo "No fix produced. Agent rationale:"
            cat "$RUNNER_TEMP/repair-no-fix.txt"
            exit 0
          fi
          echo "error: repair agent finished with neither a PR nor a documented no-fix rationale" >&2
          exit 1