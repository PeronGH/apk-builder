name: Repair failed bump build

on:
  repository_dispatch:
    types: [repair-bump-build]

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      FAILED_RUN_ID: ${{ github.event.client_payload.run_id }}
      FAILED_RUN_URL: ${{ github.event.client_payload.run_url }}
      REPAIR_BRANCH: fix/ci-${{ github.event.client_payload.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.client_payload.after }}
          submodules: recursive

      - name: Create repair branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$REPAIR_BRANCH"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - uses: android-actions/setup-android@v4

      - name: Install Pi
        run: |
          set -euo pipefail
          git fetch --depth 1 origin main
          mkdir -p "$HOME/.pi/agent"
          git show FETCH_HEAD:.github/pi/models.json > "$HOME/.pi/agent/models.json"
          chmod 600 "$HOME/.pi/agent/models.json"
          git show FETCH_HEAD:.github/pi/fix-failed-build.md > "$RUNNER_TEMP/fix-failed-build.md"
          npm install -g --ignore-scripts @earendil-works/pi-coding-agent@0.84.2

      - name: Repair
        run: |
          set -euo pipefail
          pi -e npm:@peron_js/web-pi --mode json --thinking max "@$RUNNER_TEMP/fix-failed-build.md"
