name: Bump submodules

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    outputs:
      before: ${{ steps.bump.outputs.before }}
      after: ${{ steps.bump.outputs.after }}
      bumped: ${{ steps.bump.outputs.bumped }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          before="$(git rev-parse HEAD)"
          echo "before=$before" >>"$GITHUB_OUTPUT"

          for dir in apps/*/; do
              name="$(basename "$dir")"
              builder/bump.sh "$dir"
              if git diff --quiet -- "$dir"; then
                  continue
              fi
              git add "$dir"
              git commit -m "chore: bump $name"
          done

          if [ "$(git rev-parse HEAD)" = "$before" ]; then
              echo "no bumps"
              echo "bumped=false" >>"$GITHUB_OUTPUT"
              exit 0
          fi

          git push
          echo "bumped=true" >>"$GITHUB_OUTPUT"
          echo "after=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"

  build:
    needs: bump
    if: needs.bump.outputs.bumped == 'true'
    uses: ./.github/workflows/build.yml
    with:
      before: ${{ needs.bump.outputs.before }}
      sha: ${{ needs.bump.outputs.after }}
    secrets: inherit

  repair:
    needs: [bump, build]
    if: ${{ always() && needs.bump.result == 'success' && needs.build.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch repair event
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAILED_RUN_ID: ${{ github.run_id }}
          FAILED_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED_BEFORE_SHA: ${{ needs.bump.outputs.before }}
          FAILED_AFTER_SHA: ${{ needs.bump.outputs.after }}
        run: |
          set -euo pipefail
          jq -n \
            --arg run_id "$FAILED_RUN_ID" \
            --arg run_url "$FAILED_RUN_URL" \
            --arg before "$FAILED_BEFORE_SHA" \
            --arg after "$FAILED_AFTER_SHA" \
            '{event_type: "repair-bump-build", client_payload: {run_id: $run_id, run_url: $run_url, before: $before, after: $after}}' \
            > "$RUNNER_TEMP/repair-dispatch.json"
          gh api --input "$RUNNER_TEMP/repair-dispatch.json" \
            "repos/${{ github.repository }}/dispatches"
